workflow:
  name: approval_demo
  description: "Demonstrates the webform module - pauses for human approval via a browser form."

  trigger:
    type: api

  match:
    conditions:
      - path: payload.action
        operator: equals
        value: "run"
        id: do_run
    condition_logic: do_run

  context_variables:
    - name: requester
      type: string
      default: "demo-user"
      description: "Who is requesting approval."

  steps:
    - id: collect_approval
      type: webform
      module: webform
      config_file: wf_config.js
      css_file: custom.css
      timeout_minutes: 30
      delivery_step:
        id: print_link
        type: action
        action: command_module.Command.run
        input:
          command: "echo 'Approval link: {{ context.approval_link }}'"
      register_output: form_result
