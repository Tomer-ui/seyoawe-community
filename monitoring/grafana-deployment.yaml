apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      # ── Schedule only on the dedicated monitoring node ──────────────────
      nodeSelector:
        role: monitoring
      tolerations:
        - key: "role"
          operator: "Equal"
          value: "monitoring"
          effect: "NoSchedule"

      # ── Init container: download community dashboard 18283 ─────────────
      # Fetches the latest revision of "Kubernetes cluster monitoring
      # (via Prometheus)" from grafana.com and patches the datasource
      # variable so it points at our provisioned Prometheus instance.
      initContainers:
        - name: download-dashboard
          image: python:3.11-alpine
          command: ["sh", "-c"]
          args:
            - |
              apk add --no-cache curl > /dev/null 2>&1
              curl -fsSL \
                https://grafana.com/api/dashboards/18283/revisions/latest/download \
                -o /tmp/raw.json
              sed 's/${DS_PROMETHEUS}/Prometheus/g' /tmp/raw.json \
                | python3 -c "import sys,json; d=json.load(sys.stdin); d.pop('__inputs',None); d.pop('__requires',None); print(json.dumps(d))" \
                > /dashboards/k8s-cluster.json
              echo "Dashboard 18283 downloaded and patched"
          volumeMounts:
            - name: dashboards
              mountPath: /dashboards

      containers:
        - name: grafana
          image: grafana/grafana:10.4.1
          ports:
            - containerPort: 3000
          env:
            # Skip the login screen — anyone with cluster access can view dashboards
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards

      volumes:
        - name: datasource
          configMap:
            name: grafana-config
            items:
              - key: datasource.yaml
                path: datasource.yaml
        - name: dashboard-provider
          configMap:
            name: grafana-config
            items:
              - key: dashboard-provider.yaml
                path: dashboard-provider.yaml
        # emptyDir shared between init container and Grafana — holds the
        # downloaded dashboard JSON
        - name: dashboards
          emptyDir: {}
